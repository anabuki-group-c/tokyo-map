[project]
name = "longpath-mock"
version = "0.1.0"
description = "最長乗車経路実験（/route）のスタンドアロン mock。東京マップ本体とは別用途。"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    # WindowsではOSのtzデータベースが無く zoneinfo が失敗するため（Linuxでは無視される）。
    "tzdata>=2025.2",
]

[project.scripts]
route = "longpath_mock.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
