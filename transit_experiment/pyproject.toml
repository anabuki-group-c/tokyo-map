[project]
name = "transit-experiment"
version = "0.1.0"
description = "Static Tokyo rail-line importer and optional ODPT status fetcher"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.3",
    # WindowsではOSのtzデータベースが無く zoneinfo が失敗するため（Linuxでは無視される）。
    "tzdata>=2025.2",
]

[project.scripts]
transit = "transit_experiment.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
